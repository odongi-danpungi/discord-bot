<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>댕댕봇 · 관리자 로그인</title><link rel="stylesheet" href="/auth/login.css"></head><body><main class="card"><p class="eyebrow">DAENGDAENG OPERATIONS</p><h1>관리자 로그인</h1><p>방송과 커뮤니티 운영을 한 곳에서 관리하세요.</p><form id="loginForm"><label>사용자 이름<input id="user" autocomplete="username" maxlength="180" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" maxlength="1024" required></label><button id="submit">로그인</button></form><p id="status" role="status"></p><p class="hint">Railway에 설정한 DASHBOARD_USER와 DASHBOARD_PASSWORD를 사용하세요. 계정 설정을 변경하지 않았다면 사용자 이름은 admin입니다.</p><a href="/viewer/">참가자 상태 화면으로 이동</a></main><script type="module" src="/auth/login.js"></script></body></html>
